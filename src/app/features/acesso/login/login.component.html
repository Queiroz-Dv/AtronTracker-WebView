<div class="container">
  <form [formGroup]="form" (ngSubmit)="autenticar()" class="form-container">
    <h2 class="card-title">Gerenciador Atron</h2>

    <mat-card class="card-container">
      <mat-form-field>
        <mat-label>Código</mat-label>
        <input matInput formControlName="codigo" />
        <c-control-error [control]="form.get('codigo')"></c-control-error>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Senha</mat-label>
        <input matInput type="password" formControlName="senha" />
        <c-control-error [control]="form.get('senha')"></c-control-error>
      </mat-form-field>
      <mat-card-actions class="card-actions">
        <button mat-flat-button type="submit">Acessar</button>
        <button mat-flat-button color="warn" [routerLink]="['/registrar']">Registre-se</button>
      </mat-card-actions>
    </mat-card>
  </form>
</div>
